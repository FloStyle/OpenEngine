[package]
name = "openengine-logic-sandbox"
description = "Domain B: #![no_std] pure game logic. Author of WorldDelta. No raw wasm exports here."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Pure logic is an rlib. The no_std wasm cdylib with #[no_mangle] exports lives
# in the separate `openengine-logic-export` crate (exports are "unsafe
# attributes" and would violate this crate's forbid(unsafe_code)).
[lib]
crate-type = ["rlib"]

[dependencies]
openengine-contracts = { workspace = true }
openengine-math = { workspace = true }

[lints]
workspace = true

# Logic is never allowed to accidentally pull Domain A. There is no wgpu /
# winit / wasmtime / egui / rayon in this dep tree — enforced by review + CI.
