[package]
name = "openengine-logic-export"
description = "Domain B wasm cdylib: the #[no_mangle] ABI trampoline around openengine-logic-sandbox. The artifact wasmtime loads."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# cdylib → a wasm module exporting a flat C ABI the wasmtime host can call.
[lib]
crate-type = ["cdylib"]

[dependencies]
openengine-logic-sandbox = { workspace = true }
openengine-contracts = { workspace = true }
openengine-math = { workspace = true }
# SoA bridge (Phase 3 / ADR-0001): parse/cast + guest buffer mutex.
bytemuck.workspace = true
postcard.workspace = true
# Guest heap allocator for the no_std wasm artifact.
dlmalloc = { workspace = true, optional = true }

[features]
# Enable ONLY when cross-compiling for wasm32-unknown-unknown:
#   cargo build -p openengine-logic-export --target wasm32-unknown-unknown --features wasm-alloc --release
wasm-alloc = ["dep:dlmalloc"]

# NOTE: deliberately NOT inheriting `[workspace.lints]` here. The workspace
# default is `forbid(unsafe_code)`, but `#[no_mangle]` is classified as an
# *unsafe attribute* and cannot coexist with that forbid. This crate contains
# NO logic and NO `unsafe {}` blocks — it only serializes the pure system's
# output through the ABI. The forbid stays in force everywhere logic lives.
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = { level = "deny", priority = -1 }
