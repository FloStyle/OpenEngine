[package]
name = "openengine-harness"
description = "OpenEngine harness core: headless JSON-over-HTTP door for live-state observe/mutate/verify (agent + human)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "openengine-runner"
path = "src/bin/runner.rs"

[dependencies]
openengine-ecs = { path = "../ecs" }
openengine-contracts = { workspace = true }
openengine-math = { workspace = true }
bytemuck.workspace = true
postcard.workspace = true
anyhow.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
wasmtime = { workspace = true }

[lints]
workspace = true
