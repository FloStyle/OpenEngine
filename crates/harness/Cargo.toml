[package]
name = "openengine-harness"
description = "OpenEngine harness core: headless JSON-over-HTTP door for live-state observe/mutate/verify (agent + human)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# Two binaries live here (the HTTP server + the headless runner). Pick the
# server by default so `cargo run -p openengine-harness -- --port 8080` works
# exactly as every skill/doc recipe writes it.
default-run = "openengine-harness"
license.workspace = true

[[bin]]
name = "openengine-runner"
path = "src/bin/runner.rs"

[dependencies]
openengine-logic-sandbox = { path = "../logic-sandbox" }
openengine-ecs = { path = "../ecs" }
openengine-contracts = { workspace = true }
openengine-math = { workspace = true }
openengine-editor = { path = "../editor" }
openengine-ai = { path = "../ai" }
bytemuck.workspace = true
postcard.workspace = true
anyhow.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
wasmtime = { workspace = true }

# Headless offscreen capture (/frame). Default OFF keeps the harness GPU-free
# (AGENTS.md: harness pulls no wgpu/winit in headless CI). Enable with
# `--features capture` on GPU machines for the vision endpoints.
[features]
default = []
capture = ["dep:openengine-capture", "dep:base64"]

[dependencies.openengine-capture]
path = "../capture"
optional = true

[dependencies.base64]
workspace = true
optional = true

[lints]
workspace = true
