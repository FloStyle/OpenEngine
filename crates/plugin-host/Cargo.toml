[package]
name = "openengine-plugin-host"
description = "OpenEngine plugin boundary (Phase 3): Plugin trait + PluginHost lifecycle. In-process now; dylib reload transport is designed (ADR-0005), not implemented."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# The in-crate editor tool plugins (move_tool) reuse the headless editor grid
# math, so the boundary crate links the editor core. The editor pulls no
# egui/wgpu, keeping this crate headless.
openengine-editor = { path = "../editor" }

[dev-dependencies]
openengine-contracts = { workspace = true }
openengine-math = { workspace = true }
